baseURL = "https://haseebmajid.dev/"
relativeURLs = true
title = "Haseeb Majid"
pagination.pagerSize = 25
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
enableGitInfo = true
ignoreFiles = [
  "content/slides",
  ".*/source_code(/|$)",
  ".*/example(/|$)",
]

[security.exec]
# Preserve Hugo's default environment allowlist and pass Nix's CA bundle to Go/Git.
osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$', '^SSL_CERT_FILE$', '^GIT_SSL_CAINFO$']

[markup.highlight]
noclasses = false

[module]
[[module.imports]]
path = "github.com/joshed-io/reveal-hugo"

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Haseeb Majid"
description = "Haseeb Majid's blog"
keywords = ["Blog", "Portfolio", "PaperMod"]
author = "Me"
images = ["cover.png"]
DateFormat = "02 Jan 2006"
defaultTheme = "auto"
ShowReadingTime = true
ShowLikes = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowLastMod = true
ShowGitRevision = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false
SeriesOpen = false
favicon = "/favicon-32x32.png"
appleTouchIcon = "/favicon-32x32.png"

[params.og]
version = "2"
tagline = "a personal corner of the web"

[params.assets]
favicon = "/favicon-32x32.png"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/favicon-32x32.png"
safari_pinned_tab = "/safari-pinned-tab.svg"
disableHLJS = true
[params.label]
text = "Haseeb Majid"
icon = "/favicon-32x32.png"
iconHeight = 35
[params.profileMode]
enabled = true
title = "Haseeb Majid"
subtitle = "Backend software engineer 💻, Linux enthusiast 🐧 and village cricketer 🏏"
imageUrl = "https://www.gravatar.com/avatar/7ddefc94d562a0b5896ef7f1b7c69e0e?s=250"
imageWidth = 250
imageHeight = 250
imageTitle = "A photo of Haseeb Majid"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.profileMode.buttons]]
name = "Slides"
url = "slides"

[[params.profileMode.buttons]]
name = "Series"
url = "series"

[[params.profileMode.buttons]]
name = "Archive"
url = "archive"

[[params.profileMode.buttons]]
name = "Tags"
url = "tags"
[params.homeInfoParams]
Title = "Hi there 👋"
Content = "Welcome to my blog"

[[params.socialIcons]]
name = "gitlab"
url = "https://gitlab.com/hmajid2301"

[[params.socialIcons]]
name = "github"
url = "https://github.com/hmajid2301"

[[params.socialIcons]]
name = "mastodon"
url = "https://hachyderm.io/@majiy00"

[[params.socialIcons]]
name = "kofi"
url = "https://ko-fi.com/haseeb36616"

[[params.socialIcons]]
name = "youtube"
url = "https://www.youtube.com/@Majiy00"

[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true
[params.editPost]
URL = "https://gitlab.com/hmajid2301/blog/-/blob/main/content"
appendFilePath = true

[taxonomies]
tag = "tags"
series = "series"

[related]
includeNewer = true
threshold = 80
toLower = false
[[related.indices]]
name = "tags"
weight = 80
[[related.indices]]
name = "series"
weight = 60
[[related.indices]]
name = "keywords"
weight = 40

[menu]

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "talks"
name = "Talks"
url = "/talks/"
weight = 20

[[menu.main]]
identifier = "stats"
name = "Stats"
url = "https://stats.haseebmajid.dev/"
weight = 50
[menu.main.params]
external = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true


[frontmatter]
lastmod = [":git", "lastmod", ":fileModTime", "date", "publishDate"]

[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

baseURL = "https://haseebmajid.dev/"
relativeURLs = true
title = "Haseeb Majid"
pagination.pagerSize = 25
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
enableGitInfo = true
ignoreFiles = [
  ".*/source_code(/|$)",
  ".*/example(/|$)",
]

[security.exec]
# Preserve Hugo's default environment allowlist and pass Nix's CA bundle to Go/Git.
osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$', '^SSL_CERT_FILE$', '^GIT_SSL_CAINFO$']

[markup.highlight]
noclasses = false

[minify]
disableXML = true
minifyOutput = true

[params]
# Sections in RSS, archive and prev/next (Hugo would infer "posts" anyway).
mainSections = ["posts"]
env = "production"
title = "Haseeb Majid"
description = "Haseeb Majid's blog"
keywords = ["Blog", "Go", "Nix", "Talks"]
author = "Haseeb Majid"
ShowReadingTime = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowWordCount = true
showtoc = true
favicon = "/favicon-32x32.png"
appleTouchIcon = "/favicon-32x32.png"

[params.umami]
url = "https://umami.haseebmajid.dev"
websiteID = "b0e614c5-49fe-4746-ba23-e4d000cbb59e"

[params.og]
version = "2"
tagline = "a personal corner of the web"

[params.profileMode]
subtitle = "Backend software engineer 💻, Linux enthusiast 🐧 and village cricketer 🏏"

[[params.socialIcons]]
name = "gitlab"
url = "https://gitlab.com/hmajid2301"

[[params.socialIcons]]
name = "github"
url = "https://github.com/hmajid2301"

[[params.socialIcons]]
name = "mastodon"
url = "https://hachyderm.io/@majiy00"

[[params.socialIcons]]
name = "kofi"
url = "https://ko-fi.com/haseeb36616"

[[params.socialIcons]]
name = "youtube"
url = "https://www.youtube.com/@Majiy00"

[params.editPost]
URL = "https://gitlab.com/hmajid2301/blog/-/blob/main/content"
appendFilePath = true

[taxonomies]
tag = "tags"
series = "series"

[menu]

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "projects"
name = "Projects"
url = "/projects/"
weight = 20

[[menu.main]]
identifier = "til"
name = "TIL"
url = "/til/"
weight = 30

[[menu.main]]
identifier = "talks"
name = "Talks"
url = "/talks/"
weight = 40

[mediaTypes."text/redirects"]
suffixes = [""]

[outputFormats.Redirects]
mediaType = "text/redirects"
baseName = "_redirects"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "JSON", "Redirects"]

[markup.goldmark.renderer]
unsafe = true


[frontmatter]
lastmod = [":git", "lastmod", ":fileModTime", "date", "publishDate"]

[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

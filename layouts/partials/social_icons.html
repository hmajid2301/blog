<div class="social-icons">
  {{- range .icons }}
    {{- $icon_name := ( trim .name " " | lower ) }}

    {{- if (eq .url "email") }}
      <a
        href="mailto:{{ $.MaskedEmail | default $.Email }}"
        aria-label="{{ .name | title }}"
        title="{{ .name | title }}"
      >
        {{ safeHTML (index $.svg $icon_name | default $.svg.default) }}
      </a>
    {{- else }}
      <a
        href="{{ trim .url " " }}"
        target="_blank"
        aria-label="{{ .name | title }} (opens in a new tab)"
        rel="noopener noreferrer me"
        title="{{ .name | title }}"
      >
        {{ safeHTML (index $.svg $icon_name | default $.svg.default) }}
      </a>
    {{- end }}

  {{- end }}
</div>

<script
  id="goatcounter-analytics"
  data-goatcounter="https://{{ .Site.Params.goatcounter }}.goatcounter.com/count"
  async
  src="//gc.zgo.at/count.js"
></script>
{{- if .Site.Params.plausibleDomain }}
<script
  id="plausible-analytics"
  defer
  data-domain="{{ .Site.Params.plausibleDomain }}"
  src="{{ .Site.Params.plausibleScript | default "https://plausible.io/js/script.js" }}"
></script>
{{- end }}

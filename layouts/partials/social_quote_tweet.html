{{- $url := printf "https://twitter.com/%v/status/%v" .user .id -}}
<div class="tweet social-quote">
  <div class="title">
    {{ safeHTML (index hugo.Data.svg "twitter-simple") }}
    {{ with .title }}<span>{{ . }}</span>{{ end }}
  </div>

  <p>
    <a href="{{ $url }}" target="_blank" rel="noopener noreferrer">
      View tweet by @{{ .user }}
    </a>
  </p>
</div>

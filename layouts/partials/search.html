<div id="search-wrapper" data-url="{{ "" | absLangURL }}">
  <div id="search-modal">
    <header class="search-header">
      <form class="search-form">
        <div class="search-icon">
          {{ safeHTML (index hugo.Data.svg "search") }}
        </div>
        <input
          type="search"
          id="search-query"
          class="search-input"
          placeholder="Search posts, talks and topics…"
          autocomplete="off"
          spellcheck="false"
          tabindex="0"
        />
      </form>
      <button
        id="close-search-button"
        class="icon-hover"
        title="Close search"
      >
        {{ safeHTML (index hugo.Data.svg "xmark") }}
      </button>
    </header>
    <p id="search-status" class="search-status" role="status" aria-live="polite" hidden></p>
    <section class="search-section">
      <ul id="search-results"></ul>
    </section>
    <footer class="search-footer" aria-hidden="true">
      <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </footer>
  </div>
</div>

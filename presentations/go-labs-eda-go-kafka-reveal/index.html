<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kafka Reveal Compare</title>
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="https://unpkg.com/reveal.js/plugin/highlight/monokai.css" />
  </head>
  <body>
    <div class="reveal"><div class="slides">
      <section data-markdown="slides.md" data-separator="^---$" data-separator-notes="^Note:"></section>
    </div></div>
    <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="https://unpkg.com/reveal.js/plugin/highlight/highlight.js"></script>
    <script src="https://unpkg.com/reveal.js/plugin/notes/notes.js"></script>
    <script src="https://unpkg.com/reveal.js/plugin/math/math.js"></script>
    <script>
      Reveal.initialize({ hash:true, slideNumber:true, plugins:[RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX] })
    </script>
  </body>
</html>

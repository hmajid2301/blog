stages:
  - test
  - deploy

default:
  image: nixpkgs/nix-flakes:nixos-26.05-x86_64-linux
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

variables:
  # enableGitInfo needs full history, or .Lastmod falls back to the oldest fetched commit.
  GIT_DEPTH: 0
  NIX_CONFIG: "experimental-features = nix-command flakes"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Run branch pipelines, but not a duplicate one when an MR is open.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

check:build:
  stage: test
  rules: &not-main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  script:
    - nix develop -c hugo -F --destination /tmp/check --printPathWarnings 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
    # Fail on template errors and on deprecations that will break a future Hugo.
    - "! grep -E 'ERROR|deprecated' build.log"
    - test -s /tmp/check/index.html
    - test -s /tmp/check/_redirects

pages:
  stage: deploy
  interruptible: false
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - nix develop -c hugo
    - test -s public/index.html
    - >-
      nix develop -c find public -type f -regextype posix-extended
      -regex '.*\.(html|css|js|json|xml|svg|txt|map)'
      -exec gzip -kf9 {} + -exec brotli -kf {} +
  pages: true
  environment:
    name: production
    url: https://haseebmajid.dev

# Branch preview at https://preview.haseebmajid.dev/<branch-slug>/.
# Runs on the VPS runner, which mounts /srv/blog-previews at /previews
# (nixicle: modules/aspects/services/blog-previews.nix). Pruned after 14 days.
preview:
  stage: deploy
  tags: [vps] # only the VPS runner mounts /previews
  resource_group: preview/$CI_COMMIT_REF_SLUG
  rules: &preview-rules
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    PREVIEW_URL: "https://preview.haseebmajid.dev/${CI_COMMIT_REF_SLUG}/"
    HUGO_PARAMS_ENV: preview # noindex meta + robots.txt
    HUGO_RELATIVEURLS: "false" # relativeURLs doubles the sub-path on resource URLs
  script:
    - nix develop -c hugo -F --environment preview --baseURL "$PREVIEW_URL"
    - test -s public/index.html
    - rm -rf "/previews/${CI_COMMIT_REF_SLUG}.new"
    - cp -r public "/previews/${CI_COMMIT_REF_SLUG}.new"
    - rm -rf "/previews/${CI_COMMIT_REF_SLUG}"
    - mv "/previews/${CI_COMMIT_REF_SLUG}.new" "/previews/${CI_COMMIT_REF_SLUG}"
    - curl -fsS -o /dev/null "$PREVIEW_URL" && echo "Preview at $PREVIEW_URL"
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ] && [ -n "$GITLAB_API_TOKEN" ]; then
        curl -fsS -o /dev/null --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --data-urlencode "body=Preview for ${CI_COMMIT_SHORT_SHA}: $PREVIEW_URL" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
      fi
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: $PREVIEW_URL
    on_stop: preview:stop
    auto_stop_in: 2 weeks

preview:stop:
  stage: deploy
  tags: [vps]
  resource_group: preview/$CI_COMMIT_REF_SLUG
  rules: *preview-rules
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf "/previews/${CI_COMMIT_REF_SLUG}"
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    action: stop

version: "3"

tasks:
  fonts:
    desc: Fetch the licensed MonoLisa webfont from the private nixicle-assets repo
    cmds:
      - ./scripts/fetch-monolisa.sh
    status:
      - test -s static/fonts/monolisa/woff2/0-normal.woff2

  build:
    deps: [fonts]
    cmds:
      - hugo

  start_server:
    deps: [fonts]
    cmds:
      - hugo server -D --buildFuture

  new_post:
    cmds:
      - new_post "{{.CLI_ARGS}}"

  og:base:
    cmds:
      - resvg --width 1200 --height 630 scripts/og/base.svg assets/og/base.png
      - resvg --width 72 --height 36 scripts/og/status-icons.svg assets/og/status-icons.png

version: "3"

tasks:
  build:
    cmds:
      - hugo

  start_server:
    cmds:
      - hugo server -D --buildFuture

  new_post:
    cmds:
      - new_post "{{.CLI_ARGS}}"

  og:base:
    cmds:
      - resvg --width 1200 --height 630 scripts/og/base.svg assets/og/base.png
      - resvg --width 72 --height 36 scripts/og/status-icons.svg assets/og/status-icons.png

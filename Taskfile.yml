version: "3"

tasks:
  build:
    cmds:
      - hugo
      - hugo --config hugo-slides.toml

  start_server:
    # watch: true
    # sources:
    #   - 'content/**/*.md'
    cmds:
      - hugo server -D --buildFuture

  start_slides:
    # watch: true
    # sources:
    #   - 'content/**/*.md'
    cmds:
      - hugo server -D --buildFuture --config hugo-slides.toml

  new_post:
    cmds:
      - new_post "{{.CLI_ARGS}}"

  # new_talk:
  #   cmds:
  #     - hugo new --kind talk-bundle talks/{{.TALK_NAME}}

  generate:og:
    cmds:
      - ls content/posts/ | parallel 'mkdir -p content/posts/{}/images && tcardgen -c scripts/og/config.yaml --template=scripts/og/template.png -f scripts/og/fonts/ content/posts/{}/index.md -o content/posts/{}/images/cover.png'

  export:slides:
    cmds:
      - ./scripts/export-slides.sh

  slidev:dev:
    cmds:
      - |
        deck=$(find presentations -maxdepth 1 -mindepth 1 -type d -name '*-slidev' -printf '%f\n' | sort | gum choose)
        cd "presentations/$deck"
        pnpm dev

  slidev:publish:
    cmds:
      - |
        deck=$(find presentations -maxdepth 1 -mindepth 1 -type d -name '*-slidev' -printf '%f\n' | sort | gum choose)
        cd "presentations/$deck"
        if jq -e '.scripts["build:hugo"]' package.json >/dev/null 2>&1; then
          pnpm build:hugo
        else
          echo "No build:hugo script for $deck" >&2
          exit 1
        fi

  slidev:export:
    cmds:
      - |
        deck=$(find presentations -maxdepth 1 -mindepth 1 -type d -name '*-slidev' -printf '%f\n' | sort | gum choose)
        cd "presentations/$deck"
        if jq -e '.scripts.export' package.json >/dev/null 2>&1; then
          pnpm export
        else
          echo "No export script for $deck" >&2
          exit 1
        fi

  reveal:dev:
    cmds:
      - |
        deck=$(find presentations -maxdepth 1 -mindepth 1 -type d -name '*-reveal' -printf '%f\n' | sort | gum choose)
        cd "presentations/$deck"
        if jq -e '.scripts.dev' package.json >/dev/null 2>&1; then
          pnpm dev
        else
          python3 -m http.server 3031
        fi

  reveal:publish:
    cmds:
      - |
        deck=$(find presentations -maxdepth 1 -mindepth 1 -type d -name '*-reveal' -printf '%f\n' | sort | gum choose)
        cd "presentations/$deck"
        if jq -e '.scripts["build:hugo"]' package.json >/dev/null 2>&1; then
          pnpm build:hugo
        else
          echo "No build:hugo script for $deck" >&2
          exit 1
        fi

